# ============================================
# Trading Data Architecture Configuration
# Redis (Hot Storage) + TimescaleDB (Cold Storage)
# ============================================

# ============================================
# REDIS CONFIGURATION (Hot Storage)
# ============================================

# Connection settings
redis.host=localhost
redis.port=6379
redis.password=
redis.timeout=5000

# Connection pool settings
redis.max.connections=50
redis.min.idle=10
redis.max.idle=30
redis.test.on.borrow=true

# TTL Settings (in seconds)
# MBO data - keep for 24 hours (1 day)
redis.ttl.mbo=86400

# OHLC 1m candles - keep for 24 hours
redis.ttl.ohlc.1m=86400

# Stops & Icebergs - keep for 24 hours
redis.ttl.stops.icebergs=86400

# Absorption events - keep for 12 hours
redis.ttl.absorption=43200

# CBDR window data - keep for 8 hours
redis.ttl.cbdr=28800

# Market bias - keep for 1 hour
redis.ttl.bias=3600

# Dashboard cache - keep for 30 seconds (real-time updates)
redis.ttl.dashboard=30

# ============================================
# TIMESCALEDB CONFIGURATION (Cold Storage)
# ============================================

# Connection settings
timescaledb.host=localhost
timescaledb.port=5432
timescaledb.database=trading_data
timescaledb.user=postgres
timescaledb.password=X74Ot*BvtjgKuCBx

# Connection pool settings (HikariCP)
timescaledb.pool.size=20
timescaledb.pool.min.idle=5
timescaledb.pool.max.lifetime=1800000
timescaledb.connection.timeout=30000

# Query optimization
timescaledb.prepstmt.cache=true
timescaledb.prepstmt.cache.size=250
timescaledb.prepstmt.cache.sql.limit=2048

# ============================================
# CBDR WINDOW CONFIGURATION (EST Timezone)
# ============================================

# PM Window (4:00 PM - 8:00 PM EST)
cbdr.pm.start=16:00
cbdr.pm.end=20:00

# London Window (2:00 AM - 5:00 AM EST)
cbdr.london.start=02:00
cbdr.london.end=05:00

# Pre-NY Window (7:30 AM - 9:30 AM EST)
cbdr.preny.start=07:30
cbdr.preny.end=09:30

# Primary trading window (for mode recommendations)
trading.window.start=08:00
trading.window.end=11:30

# ============================================
# CONSUMER CONFIGURATION
# ============================================

# Batch processing settings
batch.size.mbo=500
batch.size.ohlc=500
batch.size.stops=500
batch.size.absorption=500

# Batch processing intervals (milliseconds)
batch.interval.mbo=5000
batch.interval.ohlc=5000
batch.interval.stops=5000
batch.interval.absorption=5000

# Detection thresholds
iceberg.refill.threshold=3
iceberg.confidence.threshold=0.7
stop.cluster.size=5
stop.cluster.time.window=5000
absorption.ratio.threshold=0.6
absorption.window.ms=2000
min.volume.threshold=10
imbalance.threshold=0.7

# ============================================
# LOGGING CONFIGURATION
# ============================================

# Log directory
log.directory=F:/Databases/Logs/

# Log levels (SEVERE, WARNING, INFO, FINE, FINER, FINEST)
log.level.redis=INFO
log.level.timescaledb=INFO
log.level.consumers=INFO
log.level.session=INFO

# Log file sizes and rotation
log.file.max.size=10485760
log.file.count=5

# Console logging
log.console.enabled=true
log.console.level=INFO

# ============================================
# FILE PATHS
# ============================================

# Symbol configuration
symbol.config.path=F:/TradingAgent/Dashboard/symbol_config.json

# Dashboard output
dashboard.output.path=F:/TradingAgent/Dashboard/

# Database logs
database.logs.path=F:/Databases/Logs/

# ============================================
# MONITORING & ALERTS
# ============================================

# Health check intervals (milliseconds)
health.check.interval.redis=30000
health.check.interval.timescaledb=60000

# Connection retry settings
connection.retry.max.attempts=3
connection.retry.delay.ms=5000

# Memory monitoring
memory.warning.threshold.mb=1024
memory.critical.threshold.mb=2048

# Alert thresholds
alert.batch.queue.size=8000
alert.connection.failures=5
alert.processing.delay.ms=10000

# ============================================
# PERFORMANCE TUNING
# ============================================

# Thread pool sizes
thread.pool.batch.processors=3
thread.pool.analyzers=2
thread.pool.cleaners=1

# Queue sizes
queue.size.mbo=10000
queue.size.ohlc=10000
queue.size.stops=5000
queue.size.absorption=5000

# Cleanup intervals
cleanup.interval.trackers.ms=30000
cleanup.interval.redis.ms=3600000
cleanup.age.threshold.ms=300000

# ============================================
# 24/7 OPERATION SETTINGS
# ============================================

# Continuous operation mode
continuous.operation.enabled=true

# Session restart on error
auto.restart.on.error=true
restart.delay.ms=5000
restart.max.attempts=3

# Data persistence checkpoint interval
checkpoint.interval.ms=60000

# ============================================
# HTF ANALYSIS CONFIGURATION
# ============================================

# Higher timeframe candle generation
htf.enabled=true
htf.timeframes=1m,5m,15m,1h,4h
htf.lookback.days=7

# Continuous aggregate refresh interval
htf.aggregate.refresh.interval.ms=3600000

# Query optimization settings
htf.query.limit.default=100
htf.query.limit.max=1000
