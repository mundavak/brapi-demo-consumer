# Redis Stack Configuration for Bookmap Trading System
# This file is mounted into the Docker container

# Network
bind 0.0.0.0
port 6379
timeout 0
tcp-keepalive 300

# Persistence
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# Memory management
maxmemory 2gb
maxmemory-policy allkeys-lru

# Append only file (durability)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Logging
loglevel notice
logfile ""

# Security (no password for localhost Docker setup)
# requirepass your_password_here

# Redis Stack modules are automatically loaded by redis-stack-server
# No need to explicitly load rejson, redisearch, redistimeseries
