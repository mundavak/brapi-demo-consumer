plugins {
    id 'java'
}

sourceCompatibility = JavaVersion.VERSION_21
targetCompatibility = JavaVersion.VERSION_21

// Exclude problematic MBO files temporarily for Java 21 upgrade
sourceSets {
    main {
        java {
            exclude '**/MboDashboard.java'
            exclude '**/MboFlowAnalyzer.java'
            exclude '**/MboMarketMonitor.java'
        }
    }
}

// Set encoding to UTF-8 to handle special characters
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

group 'com.bookmap.addons'
version '3.0.0'

repositories {
    // Prefer local maven (~/.m2/repository) so developers can `mvn install` jars there
    mavenLocal()
    mavenCentral()
    maven {
        url "https://maven.bookmap.com/maven2/releases/"
    }
    maven {
        url file('mavenLib')
    }
}

dependencies {
    // Bookmap API (compileOnly since Bookmap provides it)
    // Prefer a versioned api-core from mavenLocal, but also accept any api-core JAR placed in mavenLib.
    // This avoids build failures when api-core version differs from the hardcoded value.
    compileOnly fileTree(dir: 'mavenLib', include: ['**/api-core*.jar'])
    compileOnly fileTree(dir: 'mavenLib', include: ['**/bm-simplified-api-wrapper*.jar'])
    compileOnly group: 'org.apache.commons', name: 'commons-lang3', version: '3.12.0'

    // Broadcasting API (compileOnly since Bookmap provides it at runtime)
    // The project previously required a specific broadcasting-api:3.0.0.18 artifact which often lives only in Bookmap install.
    // Fallback strategy: allow any broadcasting-api JAR placed under mavenLib or providers/modules to be used so the build can proceed locally.
    // If you have the exact artifact you can still `mvn install` it into your local repo and it will be resolved via mavenLocal().
    //compileOnly group: 'com.bookmap.addons', name: 'broadcasting-api', version: '3.0.0.18'
    //compileOnly group: 'com.bookmap.addons', name: 'broadcasting-api', version: '3.0.0.18', classifier: 'javadoc'

    // Use any broadcasting-api jars found in mavenLib (coordinates-style layout) or in providers/modules (file drop-in).
    compileOnly files('mavenLib/com/bookmap/addons/broadcasting-api/0.54/broadcasting-api-0.54.jar')
    compileOnly fileTree(dir: 'mavenLib', include: ['**/broadcasting-api-*.jar'])
    implementation fileTree(dir: 'providers/modules', include: ['7.*.jar'])

    // Redis client for hot storage
    implementation 'redis.clients:jedis:5.1.0'

    // PostgreSQL/TimescaleDB driver for cold storage
    // Include ALL transitive dependencies to avoid ClassNotFoundException
    implementation('org.postgresql:postgresql:42.7.1') {
        transitive = true
    }
    
    // Explicitly add PostgreSQL utilities that might be missing
    implementation 'com.github.waffle:waffle-jna:3.3.0'

    // HikariCP for connection pooling
    implementation 'com.zaxxer:HikariCP:5.1.0'

    // JSON processing
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.json:json:20231013'

    // Logging
    implementation 'org.slf4j:slf4j-api:2.0.9'
    implementation 'ch.qos.logback:logback-classic:1.4.14'
}

jar {
    archiveBaseName = 'Demo-Consumer'
    archiveVersion = '3.0.0'
    from {
        configurations.runtimeClasspath.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }
    setDuplicatesStrategy(DuplicatesStrategy.EXCLUDE)

    manifest {
        attributes(
            'Implementation-Title': 'Bookmap Trading Data Consumer',
            'Implementation-Version': version,
            'Main-Class': 'com.bookmap.demo.consumer.OhlcCandleConsumer'
        )
    }
}

// Task to create Python addon JAR (copy working MBO_Automated_v3 and replace script)
task pythonAddonJar(type: Copy) {
    from('providers/modules/MBO_Automated_v3')
    into("$buildDir/tmp/pythonAddon")
    
    doLast {
        // Create JAR from the copied directory
        ant.jar(destfile: "$buildDir/tmp/MBO_Consumer_Python-1.0.0.jar") {
            fileset(dir: "$buildDir/tmp/pythonAddon") {
                exclude(name: 'script.py')
            }
        }
        
        // Add our Python script as script.py
        ant.jar(destfile: "$buildDir/tmp/MBO_Consumer_Python-1.0.0.jar", update: true) {
            zipfileset(dir: 'src/main/python', includes: 'MBO_Redis_Consumer.py', fullpath: 'script.py')
        }

        // Also include an optional Windows launcher (script.bat) that forces a specific python executable
        ant.jar(destfile: "$buildDir/tmp/MBO_Consumer_Python-1.0.0.jar", update: true) {
            zipfileset(dir: 'src/main/python', includes: 'script_launcher.bat', fullpath: 'script.bat')
        }

        // Copy to final location
        copy {
            from "$buildDir/tmp/MBO_Consumer_Python-1.0.0.jar"
            into 'F:/Bookmap/Python/build/'
        }
        
        println "Python addon JAR created: MBO_Consumer_Python-1.0.0.jar"
    }
}

// Task to copy JARs to Bookmap directory
task copyJars(type: Copy) {
    from jar
    from pythonAddonJar
    into 'F:/Bookmap/Python/build/'
    doLast {
        println "JARs copied to F:/Bookmap/Python/build/"
    }
}

build.dependsOn copyJars
copyJars.dependsOn pythonAddonJar
