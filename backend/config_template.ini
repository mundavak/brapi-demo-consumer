# Quarterly Theory Service Configuration
# Copy this file to config.ini and update with your actual values

[database]
host = localhost
port = 5432
database = bookmap_data
user = postgres
password = your_password_here

[redis]
host = localhost
port = 6379
db = 0

[service]
# Symbol to track
symbol = NQ

# Update frequency (seconds) during active hours
update_interval = 60

# Pre-market determination time (EST)
determination_start_hour = 9
determination_start_minute = 0
determination_end_hour = 9
determination_end_minute = 45

# Active trading hours (EST)
active_start_hour = 7
active_start_minute = 30
active_end_hour = 20
active_end_minute = 0

# Logging
log_level = INFO
log_file = logs/quarterly_service.log

[thresholds]
# Displacement detection threshold (ticks for NQ)
displacement_threshold_ticks = 50
displacement_time_window_seconds = 300

# Absorption balance thresholds (percent)
accumulation_balance_min = 40.0
accumulation_balance_max = 60.0

# Aggressive order percentage for expansion
expansion_aggressive_threshold = 70.0

# Stop balance threshold (bidirectional indicator)
stops_bidirectional_threshold = 0.5

[zones]
# Premium/Discount zone calculation
# Method: fibonacci, fixed_percentage, atr_based
zone_calculation_method = fibonacci

# Fibonacci levels
fib_premium_start = 0.5
fib_premium_end = 1.0
fib_discount_start = 0.0
fib_discount_end = 0.5

# Fixed percentage (if using fixed_percentage method)
fixed_zone_percentage = 5.0
